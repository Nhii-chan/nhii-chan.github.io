<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>The Development of ERP Systems</title>
<style>

.d{stroke-dasharray:400;stroke-dashoffset:400;animation:d 1.2s forwards;animation-delay:var(--d,0s)}@keyframes d{to{stroke-dashoffset:0}}
.sp{animation:sp 4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.rv{animation-direction:reverse}
.g{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;animation:g .8s forwards;animation-delay:var(--d)}@keyframes g{to{transform:scaleY(1)}}

<div id="head"><span id="yr"></span><span id="ti"></span></div>
<div id="st"></div><div id="cap"></div><div id="bar"><i></i></div>

<script>
var N=[
"Hello everyone. Today I will talk about the development of Enterprise Resource Planning systems, or ERP. Over the last sixty years, business software has moved from simple inventory tools to integrated cloud and AI platforms. Let's see how that happened.",
"Our story begins in the 1960s. Companies started using mainframe computers to control inventory. The key innovation was Material Requirements Planning, or MRP. Starting from the production schedule, MRP calculated which parts and materials a company needed, how many, and when to order them. These systems were expensive, custom-built, and used by one department at a time.",
"In the 1970s and 1980s, MRP evolved into Manufacturing Resource Planning, called MRP II. It added capacity planning, shop-floor scheduling, and cost tracking, and it connected production with purchasing and finance. This was a big step forward. However, it still focused mainly on manufacturing, while other departments such as sales and human resources kept their own separate systems.",
"This created what we call information silos. In the functional business model, each department had its own information system and its own copy of the data. Information had to travel up and down the chain of command, so companies needed many layers of managers. As a result, organizations became top-heavy and overstaffed, and they could not react quickly to change. The same data was entered many times, and the numbers often did not match.",
"In the 1990s, this problem was solved by ERP. Vendors such as SAP, Oracle, and PeopleSoft introduced fully integrated software, and the term ERP was born. Instead of separate systems, all modules, such as finance, sales, materials management, production, and human resources, share one central database. Data is entered once, at the source, and everyone sees the same up-to-date information. This removes redundant data and communication delays, and it supports the process business model, where information flows across departments instead of staying inside them. The Year 2000 problem also pushed many companies to replace their old systems.",
"In the 2000s, the Sarbanes-Oxley Act of 2002 required companies to substantiate their internal controls over information. This gave organizations another strong reason to adopt ERP. At the same time, ERP II extended systems beyond the company walls, connecting customers, suppliers, and partners through customer relationship management, supply chain management, and e-business. SAP ECC 6.0 became a widely used platform in this period.",
"From 2010 onward, ERP moved to the cloud. With Software-as-a-Service, even small companies can use ERP without buying large servers. In-memory databases such as SAP HANA provide real-time analytics, and mobile access lets managers make decisions anywhere. Today, the Internet of Things, machine learning, and AI assistants help automate forecasting, detect problems early, and handle routine tasks.",
"To summarize: ERP developed step by step, from MRP, to MRP II, to integrated ERP, to ERP II, and now to cloud and AI-enabled systems. The core idea has stayed the same: integrate business processes around one shared database, so the whole organization works with the same information. Thank you for watching."];
var T=[18,26,24,28,40,28,26,26];
var H=[["","The Development of ERP Systems"],["1960s","Inventory control and MRP"],["1970s–80s","MRP II"],["Before ERP","Functional silos"],["1990s","ERP arrives"],["2000s","Regulation and ERP II"],["2010s–today","Cloud, mobile and AI"],["Summary","From MRP to cloud and AI"]];
var DP=['Sales','Production','Purchasing','Accounting','HR'];
function db(cx,cy,rx,ry,h,c,d){return '<g class="f" style="--d:'+d+'s"><path d="M'+(cx-rx)+' '+cy+'v'+h+'a'+rx+' '+ry+' 0 0 0 '+(2*rx)+' 0v-'+h+'" fill="none" stroke="'+c+'" stroke-width="3"/><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="var(--bg)" stroke="'+c+'" stroke-width="3"/></g>'}

var V='<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">';
function s1(){var P=[[300,40,'Finance'],[430,90,'Sales'],[430,230,'Production'],[300,285,'HR'],[170,230,'Purchasing'],[170,90,'Customers']],o=V;
P.forEach(function(p,i){o+='<line class="d" style="--d:'+(.5+i*.4)+'s" x1="300" y1="160" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--a)" stroke-width="3"/><g class="f" style="--d:'+(.8+i*.4)+'s"><circle cx="'+p[0]+'" cy="'+p[1]+'" r="26" fill="var(--bg)" stroke="var(--b)" stroke-width="3"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="11">'+p[2]+'</text></g>'});
return o+'<circle class="p" cx="300" cy="160" r="38" fill="var(--a)"/><text x="300" y="167" text-anchor="middle" font-size="22" style="fill:var(--bg)">ERP</text></svg>'}
function s2(){var o=V+'<rect x="90" y="60" width="200" height="200" rx="8" fill="none" stroke="var(--ink)" stroke-width="3"/>';
[[150,120],[230,120]].forEach(function(r){o+='<g class="sp" style="transform-origin:'+r[0]+'px '+r[1]+'px"><circle cx="'+r[0]+'" cy="'+r[1]+'" r="26" fill="none" stroke="var(--a)" stroke-width="4"/><line x1="'+r[0]+'" y1="'+(r[1]-26)+'" x2="'+r[0]+'" y2="'+(r[1]+26)+'" stroke="var(--a)" stroke-width="4"/></g>'});
for(var i=0;i<5;i++)o+='<circle class="p" style="animation-delay:'+i*.3+'s" cx="'+(120+i*35)+'" cy="200" r="7" fill="var(--b)"/>';
o+='<text x="190" y="245" text-anchor="middle">MAINFRAME</text>';
for(var j=0;j<3;j++)for(var k=0;k<2;k++)o+='<rect class="sl" style="--d:'+(1+j*.8+k*.4)+'s" x="'+(360+k*80)+'" y="'+(200-j*55)+'" width="70" height="48" fill="var(--b)" opacity=".9"/>';
return o+'<text x="400" y="285" text-anchor="middle">Stock → MRP orders</text></svg>'}
function s3(){var o=V+'<path d="M80 270V160l60 30V160l60 30V160l60 30V160l60 30V270z" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="100" y="80" width="26" height="80" fill="none" stroke="var(--ink)" stroke-width="3"/><rect x="160" y="100" width="26" height="60" fill="none" stroke="var(--ink)" stroke-width="3"/>';
for(var i=0;i<4;i++)o+='<circle class="u" style="--d:'+i*.75+'s" cx="'+(i%2?173:113)+'" cy="'+(i%2?95:75)+'" r="9" fill="var(--mut)"/>';
o+='<rect x="105" y="215" width="40" height="30" fill="var(--a)" opacity=".5"/><rect x="170" y="215" width="40" height="30" fill="var(--a)" opacity=".5"/>';
o+='<g class="sp" style="transform-origin:440px 190px"><circle cx="440" cy="190" r="48" fill="none" stroke="var(--b)" stroke-width="14" stroke-dasharray="12 9"/><circle cx="440" cy="190" r="30" fill="none" stroke="var(--b)" stroke-width="4"/></g>';
o+='<g class="sp rv" style="transform-origin:510px 120px"><circle cx="510" cy="120" r="30" fill="none" stroke="var(--a)" stroke-width="10" stroke-dasharray="9 7"/></g>';
return o+'<text x="180" y="295" text-anchor="middle">Capacity · scheduling · costing</text></svg>'}
function s4(){var o=V;for(var i=0;i<5;i++){var cx=78+i*108;o+=col(i,40,100,i*.3)+'<line class="d" style="--d:'+(1+i*.2)+'s" x1="'+cx+'" y1="140" x2="'+cx+'" y2="190" stroke="var(--b)" stroke-width="3"/>'+db(cx,200,28,9,34,'var(--b)',1.2+i*.2);
if(i<4)o+='<text class="f" style="--d:'+(3+i*.4)+'s;fill:var(--r)" x="'+(cx+54)+'" y="97" text-anchor="middle" font-size="26">✕</text>'}
return o+'<text class="f" style="--d:5s" x="300" y="295" text-anchor="middle">Separate systems, separate copies of data</text></svg>'}
function s5(){var o=V;for(var i=0;i<5;i++){var cx=78+i*108;o+=col(i,15,56,i*.3)+'<line class="d" style="--d:'+(1.5+i*.3)+'s" x1="'+cx+'" y1="71" x2="300" y2="150" stroke="var(--a)" stroke-width="3"/>'}
o+=db(300,160,52,15,50,'var(--a)',3)+'<text class="f" style="--d:3.2s" x="300" y="200" text-anchor="middle">One shared database</text>';
['FI','CO','SD','MM','PP','HR'].forEach(function(m,i){var x=65+i*80;o+='<g class="f" style="--d:'+(5+i*.7)+'s"><rect x="'+x+'" y="260" width="70" height="34" rx="17" fill="var(--a)"/><text x="'+(x+35)+'" y="282" text-anchor="middle" style="fill:var(--bg)">'+m+'</text></g>'});
return o+'</svg>'}
function s6(){var o=V+'<g class="f"><rect x="50" y="60" width="150" height="190" rx="8" fill="none" stroke="var(--ink)" stroke-width="3"/><line x1="70" y1="95" x2="180" y2="95" stroke="var(--mut)" stroke-width="3"/><line x1="70" y1="120" x2="180" y2="120" stroke="var(--mut)" stroke-width="3"/><line x1="70" y1="145" x2="150" y2="145" stroke="var(--mut)" stroke-width="3"/></g><path class="d" style="--d:1s" d="M75 205l22 22 45-50" fill="none" stroke="var(--a)" stroke-width="9"/><text x="125" y="280" text-anchor="middle">SOX 2002</text>';
var P=[[400,60,'Customers'],[540,160,'Suppliers'],[400,260,'Partners']];
P.forEach(function(p,i){o+='<line class="fl" x1="390" y1="160" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--b)" stroke-width="3"/><g class="f" style="--d:'+(2+i*.6)+'s"><circle cx="'+p[0]+'" cy="'+p[1]+'" r="32" fill="var(--bg)" stroke="var(--b)" stroke-width="3"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="11">'+p[2]+'</text></g>'});
return o+'<circle class="p" cx="340" cy="160" r="46" fill="var(--a)"/><text x="340" y="165" text-anchor="middle" style="fill:var(--bg)">ERP II</text></svg>'}
function s7(){var o=V+'<path class="f" d="M150 130a40 40 0 0 1 70-30a50 50 0 0 1 95 10a35 35 0 0 1 5 70H160a35 35 0 0 1-10-50z" fill="none" stroke="var(--a)" stroke-width="4"/><text class="f" style="--d:.5s" x="240" y="140" text-anchor="middle" font-size="18">Cloud ERP</text>';
[40,70,95,125,160].forEach(function(h,i){o+='<rect class="g" style="--d:'+(1+i*.5)+'s" x="'+(110+i*40)+'" y="'+(280-h)+'" width="26" height="'+h+'" fill="var(--b)"/>'});
o+='<text x="210" y="305" text-anchor="middle" font-size="12">Real-time analytics (HANA)</text>';
[['AI',470,90],['IoT',540,170],['Mobile',450,240]].forEach(function(p,i){o+='<g class="f" style="--d:'+(3+i*.8)+'s"><circle class="p" cx="'+p[1]+'" cy="'+p[2]+'" r="34" fill="none" stroke="var(--a)" stroke-width="3"/><text x="'+p[1]+'" y="'+(p[2]+5)+'" text-anchor="middle">'+p[0]+'</text></g>'});
return o+'</svg>'}
function s8(){var o=V+'<line class="d" style="stroke-dasharray:600;stroke-dashoffset:600;--d:.3s" x1="50" y1="160" x2="550" y2="160" stroke="var(--ink)" stroke-width="4"/>';
[['1960s','MRP'],['1980s','MRP II'],['1990s','ERP'],['2000s','ERP II'],['2010s+','Cloud & AI']].forEach(function(p,i){var x=70+i*115,d=1+i*1.2;o+='<g class="f" style="--d:'+d+'s"><circle cx="'+x+'" cy="160" r="12" fill="var(--a)"/><text x="'+x+'" y="'+(i%2?205:125)+'" text-anchor="middle" font-size="18" style="fill:var(--a)">'+p[0]+'</text><text x="'+x+'" y="'+(i%2?228:105)+'" text-anchor="middle">'+p[1]+'</text></g>'});
return o+'<text class="f" style="--d:7.5s" x="300" y="290" text-anchor="middle" font-size="18">One shared database, integrated processes</text></svg>'}
var SC=[s1,s2,s3,s4,s5,s6,s7,s8],voice=false,k=0,tD,sD,tm,st=document.getElementById('st'),vo=document.getElementById('vo'),rp=document.getElementById('rp');
function go(n){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}
 k=n;st.innerHTML=SC[n]();document.getElementById('yr').textContent=H[n][0];document.getElementById('ti').textContent=H[n][1];
 document.getElementById('cap').textContent=N[n];document.querySelector('#bar i').style.width=((n+1)/8*100)+'%';
 tD=false;sD=!voice;tm=setTimeout(function(){tD=true;chk()},T[n]*1000);if(voice)say(n)}
function say(n){try{var u=new SpeechSynthesisUtterance(N[n]);u.lang='en-US';u.rate=.95;u.onend=u.onerror=function(){if(k==n){sD=true;chk()}};speechSynthesis.speak(u)}catch(e){sD=true}}
function chk(){if(!(tD&&sD))return;if(k>=7){rp.hidden=false;return}go(k+1)}
vo.onclick=function(){voice=!voice;vo.textContent=voice?'Turn off voice':'Turn on voice';if(voice){sD=false;say(k)}else{try{speechSynthesis.cancel()}catch(e){}sD=true;chk()}};
rp.onclick=function(){rp.hidden=true;go(0)};
go(0);
</script></body></html>
