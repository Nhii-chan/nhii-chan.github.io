var N=[
"Hello everyone. Today I will talk about the development of Enterprise Resource Planning systems, or ERP. Over the last sixty years, business software has moved from simple inventory tools to integrated cloud and AI platforms. Let's see how that happened.",
"Our story begins in the 1960s. Companies started using mainframe computers to control inventory. The key innovation was Material Requirements Planning, or MRP. Starting from the production schedule, MRP calculated which parts and materials a company needed, how many, and when to order them. These systems were expensive, custom-built, and used by one department at a time.",
"In the 1970s and 1980s, MRP evolved into Manufacturing Resource Planning, called MRP II. It added capacity planning, shop-floor scheduling, and cost tracking, and it connected production with purchasing and finance. This was a big step forward. However, it still focused mainly on manufacturing, while other departments such as sales and human resources kept their own separate systems.",
"This created what we call information silos. In the functional business model, each department had its own information system and its own copy of the data. Information had to travel up and down the chain of command, so companies needed many layers of managers. As a result, organizations became top-heavy and overstaffed, and they could not react quickly to change. The same data was entered many times, and the numbers often did not match.",
"In the 1990s, this problem was solved by ERP. Vendors such as SAP, Oracle, and PeopleSoft introduced fully integrated software, and the term ERP was born. Instead of separate systems, all modules, such as finance, sales, materials management, production, and human resources, share one central database. Data is entered once, at the source, and everyone sees the same up-to-date information. This removes redundant data and communication delays, and it supports the process business model, where information flows across departments instead of staying inside them. The Year 2000 problem also pushed many companies to replace their old systems.",
"In the 2000s, the Sarbanes-Oxley Act of 2002 required companies to substantiate their internal controls over information. This gave organizations another strong reason to adopt ERP. At the same time, ERP II extended systems beyond the company walls, connecting customers, suppliers, and partners through customer relationship management, supply chain management, and e-business. SAP ECC 6.0 became a widely used platform in this period.",
"From 2010 onward, ERP moved to the cloud. With Software-as-a-Service, even small companies can use ERP without buying large servers. In-memory databases such as SAP HANA provide real-time analytics, and mobile access lets managers make decisions anywhere. Today, the Internet of Things, machine learning, and AI assistants help automate forecasting, detect problems early, and handle routine tasks.",
"To summarize: ERP developed step by step, from MRP, to MRP II, to integrated ERP, to ERP II, and now to cloud and AI-enabled systems. The core idea has stayed the same: integrate business processes around one shared database, so the whole organization works with the same information. Thank you for watching."];
